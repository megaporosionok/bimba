<!DOCTYPE html>
<html>
<head>
    <title>Vatnik</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars */
            background-color: black;
        }
        canvas {
            background-color: white;
            border: 1px solid black;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom:0;
            margin: auto;
            /* Max dimensions to ensure it doesn't overflow before JS kicks in or if JS fails */
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1200" height="800"></canvas>
    <script src="game.js"></script>

</body>
</html>
